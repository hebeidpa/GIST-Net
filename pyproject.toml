[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gist-net"
version = "1.0.0"
description = "Frozen inference and Grad-CAM utilities for GIST-Net"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "matplotlib>=3.7",
  "monai>=1.3",
  "nibabel>=5.2",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-image>=0.21",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.scripts]
gist-net-infer = "gist_net.infer:main"
gist-net-gradcam = "gist_net.gradcam:main"

[tool.setuptools.packages.find]
where = ["src"]
